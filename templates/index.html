
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8dd8f8">
  <title>Aqua Log</title>
  <link rel="manifest" href="/static/manifest.json?v=3">
  <link rel="stylesheet" href="/static/style.css?v=2.5">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .bottom-nav{
      display:grid !important;
      grid-template-columns:repeat(3,minmax(0,1fr)) !important;
    }
    .bottom-nav .nav-btn{
      width:100% !important;
      min-width:0 !important;
      justify-self:stretch !important;
      text-align:center !important;
    }
  </style>


  <style id="coach-layout-v18">
    .coach-card{
      display:block !important;
      position:relative !important;
      min-height:0 !important;
      padding:0 !important;
      margin-bottom:14px !important;
      background:transparent !important;
      border-radius:28px !important;
      box-shadow:0 12px 30px rgba(61,151,93,.12) !important;
      overflow:hidden !important;
    }

    /* 緑の大きな1枚カード */
    .coach-card .coach-visual{
      width:100% !important;
      min-height:0 !important;
      padding:22px 18px 0 !important;
      margin:0 !important;
      background:linear-gradient(145deg,#ccefd6 0%,#eaf8ee 100%) !important;
      display:flex !important;
      flex-direction:column !important;
      align-items:center !important;
      box-sizing:border-box !important;
    }

    .coach-card .coach-title{
      width:100% !important;
      margin:0 0 8px !important;
      text-align:center !important;
      font-size:18px !important;
      line-height:1.4 !important;
      font-weight:900 !important;
      color:#287d45 !important;
    }

    /* あきおちゃんを中央・大きめ */
    .coach-card .character-wrap{
      position:static !important;
      width:100% !important;
      height:270px !important;
      margin:0 !important;
      padding:0 !important;
      display:flex !important;
      justify-content:center !important;
      align-items:flex-end !important;
      overflow:hidden !important;
      transform:none !important;
    }

    .coach-card .character-silhouette{
      display:block !important;
      position:static !important;
      width:auto !important;
      height:270px !important;
      max-width:95% !important;
      max-height:270px !important;
      object-fit:contain !important;
      object-position:bottom center !important;
      opacity:1 !important;
      transform:none !important;
      filter:none !important;
      margin:0 auto !important;
    }

    /* 白コメントカードを緑カードの内側へ */
    .coach-card .ai-comment-text{
      display:block !important;
      position:relative !important;
      z-index:3 !important;
      width:calc(100% - 36px) !important;
      min-height:120px !important;
      margin:-2px 18px 20px !important;
      padding:20px 22px !important;
      background:#fff !important;
      border:0 !important;
      border-radius:22px !important;
      box-shadow:0 8px 22px rgba(42,118,70,.10) !important;
      color:#23412d !important;
      font-size:15px !important;
      font-weight:700 !important;
      line-height:1.9 !important;
      text-align:left !important;
      white-space:pre-wrap !important;
      box-sizing:border-box !important;
    }

    /* ai-comment-textも緑背景の中に見えるよう、カード全体の下地を緑にする */
    .coach-card{
      background:linear-gradient(145deg,#ccefd6 0%,#eaf8ee 100%) !important;
    }

    @media(max-width:480px){
      .coach-card .coach-visual{
        padding:14px 12px 0 !important;
        min-height:0 !important;
      }
      .coach-card .coach-title{
        font-size:15px !important;
        line-height:1.3 !important;
        margin:0 0 2px !important;
      }
      .coach-card .character-wrap{
        height:190px !important;
        margin:0 !important;
      }
      .coach-card .character-silhouette{
        height:205px !important;
        max-height:205px !important;
        max-width:98% !important;
      }
      .coach-card .ai-comment-text{
        width:calc(100% - 24px) !important;
        margin:0 12px 12px !important;
        padding:16px !important;
        border-radius:18px !important;
        font-size:14px !important;
        line-height:1.75 !important;
      }
    }
  </style>


  <style id="coach-mobile-tight-v20">
    @media(max-width:480px){
      .coach-card .coach-visual{
        padding:12px 12px 0 !important;
        min-height:0 !important;
        height:auto !important;
        justify-content:flex-start !important;
      }

      .coach-card .coach-title{
        margin:0 0 0 !important;
        padding:0 !important;
        font-size:15px !important;
        line-height:1.25 !important;
      }

      .coach-card .character-wrap{
        height:210px !important;
        min-height:0 !important;
        margin:-2px 0 0 !important;
        padding:0 !important;
        align-items:flex-end !important;
      }

      .coach-card .character-silhouette{
        height:210px !important;
        max-height:210px !important;
        margin:0 auto !important;
      }

      .coach-card .ai-comment-text{
        width:calc(100% - 24px) !important;
        margin:0 12px 12px !important;
        padding:16px !important;
      }
    }
  </style>


  <style id="coach-mobile-ultratight-v21">
    @media(max-width:480px){
      .coach-card .coach-visual{
        padding:10px 12px 0 !important;
        min-height:0 !important;
        height:auto !important;
        justify-content:flex-start !important;
      }

      .coach-card .coach-title{
        margin:0 0 -14px !important;
        padding:0 !important;
        font-size:15px !important;
        line-height:1.2 !important;
        position:relative !important;
        z-index:3 !important;
      }

      .coach-card .character-wrap{
        height:190px !important;
        min-height:0 !important;
        margin:0 !important;
        padding:0 !important;
        align-items:flex-end !important;
        overflow:hidden !important;
      }

      .coach-card .character-silhouette{
        height:205px !important;
        max-height:205px !important;
        margin:0 auto -2px !important;
      }

      .coach-card .ai-comment-text{
        width:calc(100% - 20px) !important;
        margin:-1px 10px 10px !important;
        padding:15px 16px !important;
        border-radius:18px !important;
      }
    }
  </style>


  <style id="meal-add-button-v1">
    .meal-add-button{
      width:100%;
      margin-top:12px;
      border:0;
      border-radius:16px;
      background:#e3f6e9;
      color:#287d45;
      padding:13px 16px;
      font-weight:900;
      font-size:15px;
      text-align:center;
      box-shadow:0 4px 12px rgba(66,173,104,.08);
    }
    .meal-add-button:active{
      transform:translateY(1px);
    }
  </style>

</head>
<body>
  <main class="app-shell">
    <span id="buildMarker" style="display:none">AquaDiet-index-v2.5</span>
    <header class="topbar">
      <div>
        <div class="eyebrow">AQUADIET</div>
        <h1>今日の記録</h1>
      </div>
      <input id="datePicker" type="date" value="{{ selected_date }}">
    </header>

    <section id="todayTab" class="tab-panel active">
      <section class="card weight-card">
        <div class="section-head">
          <h2>⚖️ 体重</h2>
          <span id="weightDiff" class="subtle">前回比 —</span>
        </div>
        <div class="weight-input-wrap">
          <input id="weight" type="number" step="0.1" min="20" max="300" placeholder="00.0">
          <span>kg</span>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>🍽️ 食事</h2>
        </div>
        <div id="mealList"></div>
        <button class="meal-add-button" type="button" onclick="addMeal()">＋ 食事を追加</button>
      </section>

      <section class="card">
        <h2>🏃 運動</h2>
        <div class="exercise-grid">
          {% for ex in exercises %}
          <label class="check-pill">
            <input type="checkbox" class="exercise-check" value="{{ ex }}">
            <span>{{ ex }}</span>
          </label>
          {% endfor %}
        </div>
        <textarea id="exerciseMemo" rows="2" placeholder="回数や内容のメモ（例：腹筋20回）"></textarea>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>💪 筋肉痛</h2>
        </div>
        <div class="inline-add">
          <input id="sorenessInput" type="text" placeholder="筋肉名（例：腹直筋）">
          <button type="button" onclick="addSoreness()">追加</button>
        </div>
        <div id="sorenessTags" class="tags"></div>
      </section>

      <button id="saveButton" class="primary-button" onclick="saveDayAndComment()">記録を保存</button>

      <section class="coach-card">
        <div class="coach-visual">
          <h2 class="coach-title">🌟あきおちゃんからのコメント🌟</h2>
          <div class="character-wrap">
            <img src="/static/character.webp" alt="あきおちゃん" class="character-silhouette">
          </div>
        </div>

        <div id="aiComment" class="ai-comment-text">記録したら、今日の様子を見てコメントする。</div>
      </section>
    </section>

    <section id="historyTab" class="tab-panel">
      <section class="card">
        <h2>📖 履歴</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </section>

    <section id="graphTab" class="tab-panel">
      <section class="card">
        <h2>📈 体重グラフ</h2>
        <canvas id="weightChart"></canvas>
      </section>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="todayTab"><span>☀️</span>今日</button>
    <button class="nav-btn" data-tab="historyTab"><span>📖</span>履歴</button>
    <button class="nav-btn" data-tab="graphTab"><span>📈</span>グラフ</button>
  </nav>

<script>
const mealTypes = ["朝食","昼食","夕飯","夜食","間食"];
let soreness = [];
let weightChart = null;

function mealCard(data={}) {
  const options = mealTypes.map(x => `<option ${x === (data.meal_type || "朝食") ? "selected" : ""}>${x}</option>`).join("");
  const div = document.createElement("div");
  div.className = "meal-item";
  div.innerHTML = `
    <div class="meal-top">
      <select class="meal-type">${options}</select>
      <button type="button" class="delete-button" onclick="this.closest('.meal-item').remove()">削除</button>
    </div>
    <textarea class="meal-text" rows="2" placeholder="食べたものを入力">${data.meal_text || ""}</textarea>
    <label class="vomit-check">
      <input type="checkbox" class="meal-vomited" ${data.vomited ? "checked" : ""}>
      <span>この食事のあと嘔吐した</span>
    </label>`;
  return div;
}

function addMeal(data={}) {
  document.getElementById("mealList").appendChild(mealCard(data));
}

function addSoreness(name=null) {
  const input = document.getElementById("sorenessInput");
  const value = (name || input.value).trim();
  if (!value || soreness.includes(value)) return;
  soreness.push(value);
  input.value = "";
  renderSoreness();
}

function renderSoreness() {
  document.getElementById("sorenessTags").innerHTML = soreness.map((x,i) =>
    `<button type="button" class="tag" onclick="removeSoreness(${i})">${x} ×</button>`
  ).join("");
}

function removeSoreness(i) {
  soreness.splice(i,1);
  renderSoreness();
}

async function loadDay() {
  const d = document.getElementById("datePicker").value;
  const res = await fetch(`/api/day/${d}`);
  if (!res.ok) {
    console.warn("load failed");
    document.getElementById("mealList").innerHTML = "";
    addMeal();
    return;
  }
  const data = await res.json();
  document.getElementById("weight").value = data.daily?.weight ?? "";
  document.getElementById("aiComment").textContent = data.daily?.ai_comment || "記録したら、今日の様子を見てコメントする。";

  document.getElementById("mealList").innerHTML = "";
  (data.meals?.length ? data.meals : [{}]).forEach(addMeal);

  document.querySelectorAll(".exercise-check").forEach(c => c.checked = false);
  let memos = [];
  (data.exercises || []).forEach(e => {
    const box = [...document.querySelectorAll(".exercise-check")].find(x => x.value === e.exercise_type);
    if (box) box.checked = true;
    if (e.memo) memos.push(e.memo);
  });
  document.getElementById("exerciseMemo").value = [...new Set(memos)].join(" / ");

  soreness = (data.soreness || []).map(x => x.muscle_name);
  renderSoreness();

  await updateWeightDiff(d, data.daily?.weight);
}

async function updateWeightDiff(d, currentWeight) {
  const res = await fetch("/api/weights");
  if (!res.ok) return;
  const rows = await res.json();
  const previous = rows.filter(x => x.log_date < d && x.weight != null).slice(-1)[0];
  const el = document.getElementById("weightDiff");
  if (currentWeight != null && previous?.weight != null) {
    const diff = Number(currentWeight) - Number(previous.weight);
    el.textContent = `前回比 ${diff >= 0 ? "+" : ""}${diff.toFixed(1)}kg`;
  } else {
    el.textContent = "前回比 —";
  }
}

function collectMeals() {
  return [...document.querySelectorAll(".meal-item")].map(row => ({
    meal_type: row.querySelector(".meal-type").value,
    meal_text: row.querySelector(".meal-text").value.trim(),
    vomited: row.querySelector(".meal-vomited").checked
  }));
}

async function saveDay(showAlert=true) {
  const selected = [...document.querySelectorAll(".exercise-check")];
  const memo = document.getElementById("exerciseMemo").value.trim();
  const body = {
    date: document.getElementById("datePicker").value,
    weight: document.getElementById("weight").value,
    meals: collectMeals(),
    exercises: selected.map(x => ({
      exercise_type: x.value,
      done: x.checked,
      memo: x.checked ? memo : ""
    })),
    soreness
  };

  const res = await fetch("/api/day", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });

  if (!res.ok) throw new Error(await res.text());
  if (showAlert) toast("保存しました");
  return true;
}

async function saveDayAndComment() {
  const btn = document.getElementById("saveButton");
  const bubble = document.getElementById("aiComment");

  btn.disabled = true;
  btn.textContent = "保存してコメント作成中…";
  bubble.textContent = "今日の記録を見てる……";

  try {
    await saveDay(false);

    const res = await fetch("/api/ai-comment", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date:document.getElementById("datePicker").value})
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "AI error");

    bubble.textContent = data.comment;
    toast("保存しました");
    await updateWeightDiff(
      document.getElementById("datePicker").value,
      document.getElementById("weight").value || null
    );
  } catch(e) {
    console.error(e);
    bubble.textContent = "記録は確認した。AIコメントを作れなかった場合は、少ししてからもう一度保存してみてくれ。";
    alert("保存またはAIコメント生成でエラーが発生しました。Renderのログを確認してください。");
  } finally {
    btn.disabled = false;
    btn.textContent = "記録を保存";
  }
}

async function generateAIComment() {
  // 履歴等から再生成したくなった時のために関数自体は残す
  const bubble = document.getElementById("aiComment");
  bubble.textContent = "今日の記録を見てる……";
  const res = await fetch("/api/ai-comment", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({date:document.getElementById("datePicker").value})
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "AI error");
  bubble.textContent = data.comment;
}

async function loadHistory() {
  const res = await fetch("/api/history");
  if (!res.ok) return;
  const rows = await res.json();
  const wrap = document.getElementById("historyList");
  wrap.innerHTML = rows.length ? rows.map(x => `
    <button class="history-row" onclick="openDate('${x.log_date}')">
      <div>
        <strong>${x.log_date}</strong>
        <div class="subtle">${x.ai_comment ? escapeHtml(x.ai_comment).slice(0,70) : "AIコメントなし"}</div>
      </div>
      <span class="history-weight">${x.weight != null ? x.weight + "kg" : "—"}</span>
    </button>`).join("") : `<p class="subtle">まだ記録がありません。</p>`;
}

async function loadGraph() {
  const res = await fetch("/api/weights");
  if (!res.ok) return;
  const rows = await res.json();
  const ctx = document.getElementById("weightChart");
  if (weightChart) weightChart.destroy();
  weightChart = new Chart(ctx, {
    type:"line",
    data:{
      labels:rows.map(x => x.log_date),
      datasets:[{label:"体重 (kg)", data:rows.map(x => x.weight), tension:.3}]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:false}}
    }
  });
}

function openDate(d) {
  // iPhone Safari/PWA対策:
  // 過去日のフォームをその場で差し替えず、ページを再読み込みする。
  window.location.href = "/?date=" + encodeURIComponent(d);
}

function switchTab(tabId) {
  document.querySelectorAll(".tab-panel").forEach(x => x.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.tab === tabId));
  if (tabId === "historyTab") loadHistory();
  if (tabId === "graphTab") loadGraph();
}

document.querySelectorAll(".nav-btn").forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
document.getElementById("datePicker").addEventListener("change", function() {
  const selectedDate = this.value;
  if (!selectedDate) return;
  window.location.href = "/?date=" + encodeURIComponent(selectedDate);
});
document.getElementById("sorenessInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); addSoreness(); }
});

function toast(text) {
  const x = document.createElement("div");
  x.className = "toast";
  x.textContent = text;
  document.body.appendChild(x);
  setTimeout(() => x.remove(), 1700);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
loadDay();
</script>
</body>
</html>
