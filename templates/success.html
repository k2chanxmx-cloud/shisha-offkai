<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>お支払い完了｜あめ × じゃない方 シーシャオフ会</title>
  <style>
    :root{
      --pink:#ef8fbb;
      --rose:#d96b9c;
      --ink:#4a2f3d;
      --muted:#8f6d7e;
      --line:#efb8d1;
      --soft:#fff7fa;
    }

    *{
      box-sizing:border-box;
      min-width:0;
    }

    html,body{
      margin:0;
      width:100%;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 10%,rgba(255,213,232,.75),transparent 30%),
        linear-gradient(180deg,#fff8fb 0%,#ffeef6 55%,#fff 100%);
      padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }

    .page{
      width:100%;
      max-width:620px;
      margin:0 auto;
      min-height:calc(100dvh - 48px);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      width:100%;
      background:rgba(255,255,255,.96);
      border:1px solid var(--line);
      border-radius:26px;
      padding:30px 22px;
      text-align:center;
      box-shadow:0 18px 45px rgba(183,104,143,.15);
      overflow:hidden;
    }

    .mark{
      width:72px;
      height:72px;
      border-radius:50%;
      display:grid;
      place-items:center;
      margin:0 auto 18px;
      background:linear-gradient(135deg,#ffd7e9,#f3a5c8);
      font-size:34px;
      box-shadow:0 8px 18px rgba(217,107,156,.16);
    }

    h1{
      font-size:clamp(27px,8vw,40px);
      line-height:1.2;
      margin:0 0 10px;
      overflow-wrap:anywhere;
    }

    .lead{
      color:var(--rose);
      font-weight:800;
      font-size:clamp(16px,4.5vw,19px);
      line-height:1.5;
    }

    .event-box{
      margin:22px 0 18px;
      padding:17px 14px;
      border-radius:18px;
      background:var(--soft);
      border:1px dashed var(--line);
      line-height:1.9;
      font-size:15px;
      overflow-wrap:anywhere;
    }

    .event-title{
      display:block;
      font-size:17px;
      line-height:1.5;
      margin-bottom:5px;
    }

    .session{
      margin:16px 0 0;
      padding:12px 13px;
      border-radius:14px;
      background:#fff;
      border:1px solid #f3d5e2;
      text-align:left;
    }

    .session-label{
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-bottom:5px;
    }

    .session-id{
      display:block;
      width:100%;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:11px;
      line-height:1.55;
      color:#8b6075;
      overflow-wrap:anywhere;
      word-break:break-all;
    }

    .small{
      font-size:12px;
      color:var(--muted);
      line-height:1.8;
      margin:17px 0 0;
      overflow-wrap:anywhere;
    }

    .button{
      display:block;
      width:100%;
      margin-top:22px;
      text-decoration:none;
      color:#fff;
      font-weight:800;
      font-size:16px;
      padding:15px 18px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--pink),var(--rose));
      box-shadow:0 9px 20px rgba(217,107,156,.24);
    }

    @media (max-width:480px){
      body{
        padding:
          max(12px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
      }

      .page{
        min-height:calc(100dvh - 30px);
        align-items:flex-start;
        padding-top:8px;
      }

      .card{
        border-radius:22px;
        padding:24px 15px 22px;
      }

      .mark{
        width:62px;
        height:62px;
        font-size:29px;
        margin-bottom:14px;
      }

      .event-box{
        margin-top:18px;
        padding:15px 11px;
        font-size:14px;
      }

      .event-title{
        font-size:16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="mark">♡</div>

      <h1>お支払い完了</h1>
      <div class="lead">ありがとうございます！</div>

      <div class="event-box">
        <strong class="event-title">あめ × じゃない方 シーシャオフ会</strong>
        2026年10月18日<br>
        亀戸シーシャ Eighty -80-<br>
        参加費 4,000円
      </div>
<p class="small">
        お申し込み情報とお支払いを確認しました。<br>
        本番公開時には、このあと登録メールアドレスへ確認メールをお送りします。
      </p>

      <a class="button" href="{{ url_for('index') }}">TOPへ戻る</a>
    </section>
  </main>
</body>
</html>
