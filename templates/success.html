<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お支払い完了｜あめ × じゃない方 シーシャオフ会</title>
  <style>
    :root{--pink:#ef8fbb;--rose:#d96b9c;--ink:#4a2f3d;--muted:#8f6d7e;--line:#efb8d1}
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#fff8fb 0%,#ffeef6 55%,#fff 100%);
      padding:20px;
    }
    .card{
      width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;
      padding:34px 24px;text-align:center;box-shadow:0 18px 45px rgba(183,104,143,.15)
    }
    .mark{
      width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;
      background:linear-gradient(135deg,#ffd7e9,#f3a5c8);font-size:36px
    }
    h1{font-size:clamp(28px,7vw,42px);margin:0 0 12px}
    .lead{color:var(--rose);font-weight:800;font-size:18px}
    .box{margin:22px 0;padding:16px;border-radius:18px;background:#fff7fa;border:1px dashed var(--line);line-height:1.8}
    .small{font-size:12px;color:var(--muted);line-height:1.7}
    a{
      display:inline-block;margin-top:20px;text-decoration:none;color:#fff;font-weight:800;
      padding:14px 24px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--rose))
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">♡</div>
    <h1>お支払い完了</h1>
    <div class="lead">ありがとうございます！</div>

    <div class="box">
      <strong>あめ × じゃない方 シーシャオフ会</strong><br>
      2026年10月18日<br>
      亀戸シーシャ Eighty -80-<br>
      参加費 4,000円
    </div>

    {% if session_id %}
    <div class="small">Stripe Checkout Session: {{ session_id }}</div>
    {% endif %}

    <p class="small">
      現在はStripeサンドボックスでのテストです。<br>
      次の段階で、申込情報の保存・入金済み判定・自動メールを接続します。
    </p>

    <a href="{{ url_for('index') }}">TOPへ戻る</a>
  </main>
</body>
</html>
