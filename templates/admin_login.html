<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>運営ログイン｜シーシャオフ会</title>
<style>
:root{--pink:#ef8fbb;--rose:#d96b9c;--ink:#4a2f3d;--line:#efb8d1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Yu Gothic",sans-serif;background:linear-gradient(180deg,#fff8fb,#ffeef6);color:var(--ink)}
.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 16px 40px rgba(183,104,143,.13)}
h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#8f6d7e;font-size:13px;margin-bottom:22px}
label{display:block;font-weight:800;margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;font-size:16px}
button{width:100%;border:0;border-radius:999px;margin-top:18px;padding:14px;background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;font-weight:800;font-size:16px}
.error{margin-top:14px;background:#fff0f0;color:#a34444;border-radius:12px;padding:12px;font-size:13px}
</style>
</head>
<body>
<section class="card">
  <h1>運営ログイン</h1>
  <div class="sub">あめ × じゃない方 シーシャオフ会</div>
  <form method="post">
    <label>管理パスワード</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit">ログイン</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</section>
</body>
</html>
