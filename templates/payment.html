<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>支払い方法の選択｜あめ × じゃない方 シーシャオフ会</title>
  <style>
    :root{
      --pink2:#fff2f8; --rose:#d96b9c; --rose2:#ef8fbb; --ink:#4a2f3d;
      --muted:#8f6d7e; --line:#efb8d1; --soft:#fff8fb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#fff8fb 0%,#ffeef6 42%,#fff 100%);
      min-height:100vh;
    }
    .wrap{max-width:760px;margin:0 auto;padding:18px 16px 56px}
    .back{display:inline-flex;color:var(--rose);text-decoration:none;font-weight:700;font-size:14px;margin:2px 0 14px}
    .head{text-align:center;padding:8px 0 16px}
    .eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted)}
    h1{font-size:clamp(27px,7vw,42px);margin:8px 0 6px;line-height:1.2}
    .sub{color:var(--rose);font-weight:800;font-size:18px}
    .price{
      width:max-content;margin:14px auto 0;padding:8px 16px;border-radius:999px;
      background:#fff;border:1px solid var(--line);font-weight:800;box-shadow:0 5px 14px rgba(183,104,143,.08)
    }
    .card{
      background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:24px;
      padding:22px;margin-top:16px;box-shadow:0 12px 30px rgba(183,104,143,.10)
    }
    .title{text-align:center;font-size:21px;font-weight:800;margin:0 0 5px}
    .caption{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 20px}
    .methods{display:grid;gap:12px}
    .method{
      display:block;position:relative;border:1px solid #efd0de;border-radius:18px;
      background:#fffafd;cursor:pointer;transition:.18s;overflow:hidden
    }
    .method:hover{transform:translateY(-1px)}
    .method input{position:absolute;opacity:0;pointer-events:none}
    .method-inner{display:flex;align-items:center;gap:14px;padding:17px}
    .icon{
      width:48px;height:48px;display:grid;place-items:center;border-radius:15px;
      background:#fff;border:1px solid #f0d4e1;font-size:23px;flex:0 0 auto
    }
    .text{min-width:0;flex:1}
    .name{font-weight:900;font-size:16px}
    .desc{font-size:12px;color:var(--muted);line-height:1.55;margin-top:3px}
    .radio{
      width:22px;height:22px;border-radius:50%;border:2px solid #d9a8bf;
      position:relative;flex:0 0 auto;background:#fff
    }
    .method input:checked + .method-inner{
      background:linear-gradient(135deg,#fff8fb,#fff0f7);
      box-shadow:inset 0 0 0 2px var(--rose2)
    }
    .method input:checked + .method-inner .radio{border-color:var(--rose)}
    .method input:checked + .method-inner .radio:after{
      content:"";position:absolute;width:10px;height:10px;border-radius:50%;
      background:var(--rose);left:4px;top:4px
    }
    .note{
      margin-top:18px;padding:14px 15px;background:#fff7fa;border:1px dashed var(--line);
      border-radius:16px;color:var(--muted);font-size:12px;line-height:1.75
    }
    .selected{
      margin-top:18px;padding:14px 15px;border-radius:16px;background:#fff;
      border:1px solid #f0d1df;font-size:13px;display:none
    }
    .selected b{color:var(--rose)}
    .next{
      width:100%;border:0;margin-top:20px;border-radius:999px;padding:17px 18px;
      font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ef8fbb,#d96b9c);
      box-shadow:0 10px 20px rgba(217,107,156,.28);cursor:pointer
    }
    .next:disabled{opacity:.42;box-shadow:none;cursor:not-allowed}
    .under{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin-top:11px}
    .footer{text-align:center;color:#9c7388;font-size:12px;margin-top:24px}
    @media(max-width:520px){
      .wrap{padding:12px 12px 42px}.card{padding:18px 15px}
      .method-inner{padding:15px 13px}.icon{width:44px;height:44px;border-radius:13px}
    }
  </style>
</head>
<body>
<main class="wrap">
  <a href="{{ url_for('confirm') }}" class="back">← 入力内容の確認に戻る</a>

  <header class="head">
    <div class="eyebrow">2026.10.18 / KAMEIDO</div>
    <h1>支払い方法の選択</h1>
    <div class="sub">あめ × じゃない方 シーシャオフ会</div>
    <div class="price">参加費 3,500円</div>
  </header>

  <section class="card">
    <h2 class="title">お支払い方法を選んでね ♡</h2>
    <p class="caption">この画面では支払い方法を選択するだけです。まだ決済は行われません。</p>

    <div class="methods">
      <label class="method">
        <input type="radio" name="payment" value="card">
        <div class="method-inner">
          <div class="icon">💳</div>
          <div class="text">
            <div class="name">クレジットカード</div>
            <div class="desc">オンラインでカード決済する方法です。</div>
          </div>
          <div class="radio"></div>
        </div>
      </label>
<label class="method">
        <input type="radio" name="payment" value="bank">
        <div class="method-inner">
          <div class="icon">🏦</div>
          <div class="text">
            <div class="name">銀行振込</div>
            <div class="desc">指定口座へ3,500円をお振り込みいただく方法です。振込期限は2026年10月1日です。</div>
          </div>
          <div class="radio"></div>
        </div>
      </label>
    </div>

    <div class="selected" id="selectedBox">
      選択中：<b id="selectedName"></b>
    </div>

    <div class="note">
      ※ クレジットカードを選ぶとStripeのサンドボックス決済画面へ進みます。<br>
      銀行振込を選択すると、振込先口座とご案内を表示します。
    </div>

    <button class="next" id="nextBtn" type="button" disabled>この支払い方法で進む</button>
    <div class="under">選択内容はこのブラウザ内に一時保存されます。</div>
  </section>

  <div class="footer">あめちゃん × じゃない方 / Shisha Meetup 2026</div>
</main>

<script>
  const labels = {
    card: 'クレジットカード',
    bank: '銀行振込'
  };

  const applicationId = new URLSearchParams(location.search).get('application_id')
    || sessionStorage.getItem('shishaApplicationId');

  const radios = [...document.querySelectorAll('input[name="payment"]')];
  const nextBtn = document.getElementById('nextBtn');
  const selectedBox = document.getElementById('selectedBox');
  const selectedName = document.getElementById('selectedName');

  const saved = sessionStorage.getItem('shishaPaymentMethod');
  if (saved && labels[saved]) {
    const el = document.querySelector(`input[value="${saved}"]`);
    if (el) el.checked = true;
  }

  function update(){
    const checked = document.querySelector('input[name="payment"]:checked');
    nextBtn.disabled = !checked;
    if (checked) {
      selectedBox.style.display = 'block';
      selectedName.textContent = labels[checked.value];
      sessionStorage.setItem('shishaPaymentMethod', checked.value);
    } else {
      selectedBox.style.display = 'none';
    }
  }

  radios.forEach(r => r.addEventListener('change', update));

  nextBtn.addEventListener('click', () => {
    const checked = document.querySelector('input[name="payment"]:checked');
    if (!checked) return;

    if (checked.value === 'card') {
      if (!applicationId) {
        alert('申込情報が見つかりません。参加申し込みからやり直してください。');
        return;
      }
      window.location.href = '{{ url_for("create_checkout_session") }}?application_id=' + encodeURIComponent(applicationId);
      return;
    }
if (checked.value === 'bank') {
      if (!applicationId) {
        alert('申込情報が見つかりません。参加申し込みからやり直してください。');
        return;
      }
      window.location.href = '{{ url_for("bank_transfer") }}?application_id=' + encodeURIComponent(applicationId);
      return;
    }
  });

  update();
</script>
</body>
</html>
